<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>
  </nav>

  <div class="form-container">
    <h2>Create Account</h2>
    <p class="subtitle">Join CU Item Rescue and help your community</p>

    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="text" id="indexNumber" placeholder="Index Number / Student ID" required>
      <select id="department" required>
        <option value="">Select Department</option>
        <option value="Accounting">Accounting</option>
        <option value="Banking and Finance">Banking and Finance</option>
        <option value="Business Administration">Business Administration</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Economics">Economics</option>
        <option value="Human Resource Management">Human Resource Management</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Law">Law</option>
        <option value="Marketing">Marketing</option>
        <option value="Nursing">Nursing</option>
        <option value="Physician Assistantship">Physician Assistantship</option>
        <option value="Public Health">Public Health</option>
        <option value="Other">Other</option>
      </select>
      <select id="level" required>
        <option value="">Select Level / Year</option>
        <option value="Level 100">Level 100</option>
        <option value="Level 200">Level 200</option>
        <option value="Level 300">Level 300</option>
        <option value="Level 400">Level 400</option>
      </select>
      <input type="password" id="password" placeholder="Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <button type="submit">Create Account</button>
    </form>

    <div class="switch-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
