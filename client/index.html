<!DOCTYPE html>
<html>
<head>
  <title>CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>

    <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">&#9776;</button>

    <div class="nav-right" id="navRight">
      <span id="welcomeMsg"></span>

      <div class="nav-dropdown">
        <button class="nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false">
          My Account ▾
        </button>
        <div class="nav-dropdown-menu">
          <a href="profile.html">My Profile</a>
          <a href="dashboard.html">My Dashboard</a>
          <a href="how-to.html">How It Works</a>
        </div>
      </div>

      <a href="post-item.html" class="nav-post-btn">Post an Item</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="hero">
    <h1>Lost Something? Found Something?</h1>
    <p>Central University's Official Lost and Found Platform</p>

    <div class="item-filter-switch" id="itemFilterSwitch" data-active="all" aria-label="Filter items">
      <span class="filter-slider"></span>
      <button class="toggle-btn active" type="button" data-filter="all" aria-pressed="true">
        <span>All</span>
        <strong id="allCount">0</strong>
      </button>
      <button class="toggle-btn" type="button" data-filter="lost" aria-pressed="false">
        <span>Lost</span>
        <strong id="lostCount">0</strong>
      </button>
      <button class="toggle-btn" type="button" data-filter="found" aria-pressed="false">
        <span>Found</span>
        <strong id="foundCount">0</strong>
      </button>
    </div>
  </div>

  <div class="container">
    <p class="section-title">All Items</p>
    <p class="section-subtitle">Browse recently lost and found items on campus</p>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by title or category...">
    </div>

    <div id="itemsList" class="items-grid"></div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/items.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
