<!DOCTYPE html>
<html>
<head>
  <title>Post Item</title>
</head>
<body>

  <h2>Post Lost/Found Item</h2>

  <form id="itemForm">
    <input type="text" id="title" placeholder="Item Title" required><br><br>

    <textarea id="description" placeholder="Description" required></textarea><br><br>

    <input type="text" id="category" placeholder="Category"><br><br>

    <input type="text" id="location" placeholder="Location"><br><br>

    <select id="type">
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select><br><br>

    <button type="submit">Submit</button>
  </form>

  <script src="js/items.js"></script>
</body>
</html>
