<!DOCTYPE html>
<html>
<head>
  <title>Post Item - CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>

    <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">&#9776;</button>

    <div class="nav-right" id="navRight">
      <span id="welcomeMsg"></span>

      <div class="nav-dropdown">
        <button class="nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false">
          My Account ▾
        </button>
        <div class="nav-dropdown-menu">
          <a href="profile.html">My Profile</a>
          <a href="dashboard.html">My Dashboard</a>
          <a href="how-to.html">How It Works</a>
        </div>
      </div>

      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="form-container">
    <h2>Post an Item</h2>
    <p class="subtitle">Report a lost or found item on campus</p>

    <form id="itemForm">
      <input type="text" id="title" placeholder="Item Title" required>
      <textarea id="description" placeholder="Describe the item in detail"></textarea>

      <select id="category" required>
        <option value="">Select Category</option>
        <option value="Electronics">Electronics</option>
        <option value="Bag">Bag</option>
        <option value="ID Card">ID Card</option>
        <option value="Clothing">Clothing</option>
        <option value="Keys">Keys</option>
        <option value="Documents">Documents</option>
        <option value="Other">Other</option>
      </select>
      <div id="otherCategoryDiv" style="display:none;">
        <input type="text" id="otherCategory" placeholder="Enter item category">
      </div>

      <input type="text" id="location" placeholder="Location found or lost">

      <select id="type">
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>

      <!-- Date lost or found -->
      <label id="dateOccurredLabel" style="font-size:14px; font-weight:700; color:#666; margin-bottom:4px; display:block;">
        Date Lost
      </label>
      <input type="date" id="dateOccurred" max="">

      <!-- Student Services Option (shows only for found items) -->
      <div id="studentServicesDiv" style="display:none;">
        <label>
          <input type="checkbox" id="takenToStudentServices">
          This item has been handed to Student Services
        </label>
      </div>

      <!-- Contact Preference -->
      <p style="font-weight:700; margin-bottom:8px; margin-top:8px;">How should people contact you?</p>

      <select id="contactType">
        <option value="school_email">My School Email</option>
        <option value="personal_email">Personal Email</option>
        <option value="phone">Phone Number</option>
      </select>

      <!-- Dynamic contact input -->
      <div id="contactInputDiv"></div>

      <!-- Image Upload -->
      <div style="display:flex; gap:10px; margin-bottom:8px;">
        <label for="imageUpload" class="upload-option-btn">📁 Choose Photo</label>
        <label for="imageCapture" class="upload-option-btn">📷 Take Photo</label>
      </div>
      <input type="file" id="imageUpload" accept="image/jpeg, image/png, image/webp" style="display:none">
      <input type="file" id="imageCapture" accept="image/jpeg, image/png, image/webp" capture="environment" style="display:none">
      <div id="imagePreview" style="margin-bottom:16px;"></div>

      <button type="submit">Submit Item</button>
    </form>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/items.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
