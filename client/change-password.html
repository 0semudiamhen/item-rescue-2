<!DOCTYPE html>
<html>
<head>
  <title>Change Password - CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>
  </nav>

  <div class="form-container">
    <h2>Change Password</h2>
    <p class="subtitle">Enter your temporary password and choose a new one</p>

    <form id="changeForm">
      <input type="email" id="email" placeholder="Your school email" required>
      <input type="password" id="oldPassword" placeholder="Temporary password" required>
      <input type="password" id="newPassword" placeholder="New password" required>
      <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
      <button type="submit">Change Password</button>
    </form>

    <div class="switch-link">
      <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
