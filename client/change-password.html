<!DOCTYPE html>
<html>
<head>
  <title>Change Password - CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>
  </nav>

  <div class="form-container">
    <h2>Change Password</h2>
    <p class="subtitle" id="changeSubtitle">Request a verification code to change your password</p>

    <!-- Step 1 — Request OTP -->
    <div id="requestOtpSection">
      <button id="requestOtpBtn" type="button" style="width:100%; padding:14px; background-color:#CC0000; color:#fff; border:none; border-radius:8px; font-family:'Nunito',sans-serif; font-size:16px; font-weight:800; cursor:pointer;">
        Send Verification Code to My Email
      </button>
    </div>

    <!-- Step 2 — OTP + New Password (hidden until OTP sent) -->
    <div id="changeOtpSection" style="display:none;">
      <div class="otp-info">
        <p>Enter the 6-digit code sent to your school email, then choose a new password.</p>
      </div>
      <form id="changeForm">
        <input type="text" id="changeOtp" placeholder="6-digit verification code" maxlength="6" inputmode="numeric" required>
        <input type="password" id="newPassword" placeholder="New password" required>
        <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
        <button type="submit">Change Password</button>
      </form>
      <div style="text-align:center; margin-top:16px;">
        <button id="resendChangeOtp" class="resend-btn">Resend Code</button>
      </div>
    </div>

    <div class="switch-link" style="margin-top:24px;">
      <a href="profile.html">← Back to My Profile</a>
      <br><br>
      <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
