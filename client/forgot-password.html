<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password - CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>
  </nav>

  <div class="form-container">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your school email and we'll send you a temporary password</p>

    <form id="forgotForm">
      <input type="email" id="email" placeholder="Your school email" required>
      <button type="submit">Send Temporary Password</button>
    </form>

    <div class="switch-link">
      Remembered your password? <a href="login.html">Login</a>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
