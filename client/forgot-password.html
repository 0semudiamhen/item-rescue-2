<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password - CU Item Rescue</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Central University Logo">
      Item Rescue
    </a>
  </nav>

  <div class="form-container">
    <h2>Forgot Password</h2>
    <p class="subtitle" id="forgotSubtitle">Enter your school email and we'll send you a verification code</p>

    <!-- Step 1 — Email -->
    <form id="forgotForm">
      <input type="email" id="forgotEmail" placeholder="Your school email" required>
      <button type="submit">Send Verification Code</button>
    </form>

    <!-- Step 2 — OTP + New Password (hidden until email submitted) -->
    <div id="resetSection" style="display:none;">
      <div class="otp-info">
        <p>Enter the 6-digit code sent to your school email, then choose a new password.</p>
      </div>
      <form id="resetForm">
        <input type="text" id="resetOtp" placeholder="6-digit verification code" maxlength="6" inputmode="numeric" required>
        <input type="password" id="resetNewPassword" placeholder="New password" required>
        <input type="password" id="resetConfirmPassword" placeholder="Confirm new password" required>
        <button type="submit">Reset Password</button>
      </form>
      <div style="text-align:center; margin-top:16px;">
        <button id="resendResetOtp" class="resend-btn">Resend Code</button>
      </div>
    </div>

    <div class="switch-link">
      Remembered your password? <a href="login.html">Login</a>
    </div>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
